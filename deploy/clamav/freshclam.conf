# Настройки обновления баз сигнатур ClamAV для службы clamav (docker-compose.yml).
# Файл смонтирован только для чтения на /etc/clamav/freshclam.conf. Пять действующих
# строк ниже — без изменений из файла образа clamav/clamav:1.4.6 (решение Opus по
# итогам T-2001). Частота проверки обновлений здесь не задана: её ставит командная
# строка /init образа (при старте и раз в сутки).
UpdateLogFile /var/log/clamav/freshclam.log
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
NotifyClamd /etc/clamav/clamd.conf

# Если сеть общества не пускает к database.clamav.net, администратор может указать
# своё зеркало баз (или прокси-зеркало): раскомментируйте строку и впишите адрес.
# Без доступа к зеркалу базы остаются на дате образа и со временем устаревают.
# PrivateMirror https://clamav-mirror.example.org/clamav
