# nginx портала — вариант для установки: HTTP внутри, TLS кончается на прокси
# администратора (PLAN-001, «За прокси администратора»). Схему запроса сообщает
# прокси заголовком X-Forwarded-Proto. Стенд со своим TLS — nginx.conf.
# Монтируется в контейнер как шаблон /etc/nginx/nginx.conf.template; скрипт
# nginx-render.sh (docker-entrypoint.d) собирает из него /etc/nginx/nginx.conf:
# строку `set_real_ip_from ${TRUSTED_PROXIES};` он заменяет по одной строке на
# КАЖДЫЙ элемент TRUSTED_PROXIES (адреса и сети CIDR через запятую).
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # 6m: фото до 5 МБ в форме вместе с полями (FR-132, NFR-108)
    client_max_body_size 6m;

    # Настоящий адрес клиента — из X-Forwarded-For, но только от доверенных
    # прокси: подделанный заголовок от прочих адресов игнорируется.
    set_real_ip_from ${TRUSTED_PROXIES};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Журнал доступа (в stdout контейнера): путь без параметров запроса ($uri),
    # без куки, заголовка Authorization, тела и Referer.
    log_format portal '$remote_addr [$time_iso8601] $request_method $uri '
                      '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /dev/stdout portal;

    # Схема запроса: от доверенного прокси администратора (его заголовок попадает
    # сюда после real_ip только при доверии), иначе — своя
    map $http_x_forwarded_proto $portal_proto {
        default $scheme;
        https   https;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream portal_web {
        server web:8000;
    }

    upstream portal_web_heavy {
        server web-heavy:8000;
    }

    server {
        listen 8080;
        server_name _;

        # Статика (собрана collectstatic в образе)
        location /static/ {
            alias /srv/static/;
            expires 1h;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Загруженные файлы (логотип): только PNG и JPEG, тип по расширению, без угадывания типа
        location ~* ^/media/(.+\.(?:png|jpe?g))$ {
            alias /srv/media/$1;
            types { image/png png; image/jpeg jpg jpeg; }
            default_type application/octet-stream;
            expires 5m;
            add_header X-Content-Type-Options "nosniff" always;
        }
        # Всё прочее под /media/ не отдаётся
        location /media/ {
            add_header X-Content-Type-Options "nosniff" always;
            return 404;
        }

        # Файлы заявок (вложения и исходные письма): отдаёт Django заголовком X-Accel-Redirect, тип всегда
        # «поток байтов» (без угадывания), Cache-Control ставит Django (no-store), здесь его нет.
        # Стоят раньше общего /protected/ (фото сотрудника): у того свой тип и кэш.
        location /protected/attachments/ {
            internal;
            alias /srv/protected/attachments/;
            default_type application/octet-stream;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location /protected/inbound/ {
            internal;
            alias /srv/protected/inbound/;
            default_type application/octet-stream;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Внутренняя отдача файлов по заголовку X-Accel-Redirect от Django
        location /protected/ {
            internal;
            alias /srv/protected/;
            # Фото сотрудника (§ 8.2, доп. 41): тип и кэш задаёт nginx. add_header в location отменяет
            # наследование заголовков уровня server; на server и http их нет, поэтому здесь
            # повторяется только nosniff.
            default_type image/jpeg;
            add_header X-Content-Type-Options "nosniff" always;
            # Django ставит тот же Cache-Control, и nginx при X-Accel-Redirect его передаёт: в ответе две одинаковые
            # строки — безвредно (R-2240-41-1); каждую требует свой тест (test_photo и test_deploy_files)
            add_header Cache-Control "private, max-age=86400" always;
        }

        # Формы с вложениями до 50 МБ: заявка (/request/), создание и ответ исполнителя. Лимит тела 55m
        # (50 МБ файлов и поля); proxy-директивы не наследуются из location /, поэтому повторены.
        location = /request/ {
            client_max_body_size 55m;
            proxy_pass http://portal_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $portal_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }
        location ~ ^/tickets/(new/|[0-9]+/reply/)$ {
            client_max_body_size 55m;
            proxy_pass http://portal_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $portal_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }

        # Вложения статей базы знаний (/kb/<id>/files/, до 50 МБ): лимит тела 55m; скачивание и удаление
        # (/kb/<id>/files/<N>/…) под него не подпадают. Proxy-директивы повторены, как выше.
        location ~ ^/kb/[0-9]+/files/$ {
            client_max_body_size 55m;
            proxy_pass http://portal_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $portal_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }

        # Файлы записей списков (/lists/<id>/<n>/files/, до 50 МБ): лимит тела 55m; скачивание и удаление
        # (/lists/<id>/<n>/files/<N>/…) под него не подпадают. Proxy-директивы повторены, как выше.
        location ~ ^/lists/[0-9]+/[0-9]+/files/$ {
            client_max_body_size 55m;
            proxy_pass http://portal_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $portal_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }

        # Живые обновления (WebSocket, /ws/notify/): долгое соединение без буферизации. Proxy-директивы не
        # наследуются из location /, поэтому повторены; таймауты чтения и записи — час (в location / — 75 с).
        location /ws/ {
            proxy_pass http://portal_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $portal_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Тяжёлые адреса списков (выгрузка, загрузка, образец): свои процессы web-heavy, чтобы счётная работа
        # не задерживала другие запросы (решение 63). Директивы — как в location /, кроме proxy_pass.
        location ~ ^/lists/[0-9]+/(export|import|sample)/ {
            proxy_pass http://portal_web_heavy;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $portal_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }

        location / {
            proxy_pass http://portal_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # один уже восстановленный адрес клиента; чужой заголовок не пересылается
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $portal_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }
    }
}
