# nginx портала — вариант со своим TLS (стенд разработки, PLAN-001 «Запуск»).
# Монтируется в контейнер как шаблон /etc/nginx/nginx.conf.template; скрипт
# nginx-render.sh (docker-entrypoint.d) собирает из него /etc/nginx/nginx.conf:
# строку `set_real_ip_from ${TRUSTED_PROXIES};` он заменяет по одной строке на
# КАЖДЫЙ элемент TRUSTED_PROXIES (адреса и сети CIDR через запятую).
# На установке TLS держит прокси администратора, а nginx слушает HTTP —
# для этого nginx.prod.conf (compose: NGINX_CONF=./nginx.prod.conf).
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    client_max_body_size 2m;

    # Настоящий адрес клиента — из X-Forwarded-For, но только от доверенных
    # прокси: подделанный заголовок от прочих адресов игнорируется.
    set_real_ip_from ${TRUSTED_PROXIES};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Журнал доступа (в stdout контейнера): путь без параметров запроса ($uri),
    # без куки, заголовка Authorization, тела и Referer.
    log_format portal '$remote_addr [$time_iso8601] $request_method $uri '
                      '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /dev/stdout portal;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream portal_web {
        server web:8000;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:2m;

        # Обычный HTTP на порту HTTPS (код 497) — перенаправление на HTTPS
        error_page 497 = @https_redirect;
        location @https_redirect {
            return 301 https://$http_host$request_uri;
        }

        # Статика (собрана collectstatic в образе)
        location /static/ {
            alias /srv/static/;
            expires 1h;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Загруженные файлы (логотип): только чтение, без угадывания типа
        location /media/ {
            alias /srv/media/;
            expires 5m;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Внутренняя отдача файлов по заголовку X-Accel-Redirect от Django
        location /protected/ {
            internal;
            alias /srv/protected/;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            proxy_pass http://portal_web;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # один уже восстановленный адрес клиента; чужой заголовок не пересылается
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
        }
    }
}
