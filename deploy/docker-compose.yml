# Стенд и установка портала ИТ-отдела (PLAN-001, «Запуск»).
#
#   deploy/dev-up.sh                          # сертификат стенда + всё одной командой
#   docker compose --profile dev up -d --build # то же без выпуска сертификата
#   docker compose --profile test run --rm test  # pytest на PostgreSQL
#
# Портал: https://127.0.0.1:8031/ (nginx со своим самоподписанным TLS, его
# выпускает dev-cert.sh), ящик Mailpit: http://127.0.0.1:8025/. Профиль dev
# добавляет Mailpit и службу standtools с E2E_STAND=1 (сброс данных стенда
# между кругами приёмки: `exec standtools python manage.py e2e_reset_stand`);
# без профиля dev этого флага нет ни в одной службе.
#
# Установка за прокси администратора: NGINX_CONF=./nginx.prod.conf,
# NGINX_PORT=8080 (nginx слушает HTTP, TLS держит прокси), TRUSTED_PROXIES —
# адреса прокси администратора; внутренняя сеть compose добавляется сама.
#
# Секреты — в deploy/.env (создаётся `python3 tools/make_dev_env.py`, в git не
# попадает). Порты — только на 127.0.0.1; PostgreSQL и Valkey наружу не
# публикуются (порт 5432 на хосте занят чужим контейнером).
name: crm

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
      CRM_OWNER_PASSWORD: ${CRM_OWNER_PASSWORD:?задайте CRM_OWNER_PASSWORD в deploy/.env}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD:?задайте CRM_APP_PASSWORD в deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Образ портала: web, migrate, worker, scheduler и standtools собираются из одного Dockerfile.
  web:
    build: &portal-build
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
      network: host   # сборка ходит на PyPI с хоста: у bridge при VPN MTU мал
    image: crm-portal:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_MIGRATE_URL: ""   # владелец схемы портала не нужен: миграции — служба migrate
      DATABASE_POOL: "1"         # пул соединений psycopg (ASGI), см. config/settings.py
      # внутренняя сеть compose (там стоит наш nginx) в списке всегда
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-},${CRM_SUBNET:-172.31.77.0/24}"
      CLAMAV_HOST: "${CLAMAV_HOST:-clamav}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
      CLAMAV_TIMEOUT: "${CLAMAV_TIMEOUT:-120}"
    command: >-
      gunicorn config.asgi:application --bind 0.0.0.0:8000
      --worker-class uvicorn_worker.UvicornWorker
      --workers ${WEB_WORKERS:-4} --timeout 60 --graceful-timeout 30
      --keep-alive 30 --error-logfile - --no-control-socket
    volumes:
      - media:/app/media
      - protected:/app/protected
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Миграции под crm_owner (DATABASE_MIGRATE_URL): выполняются один раз и завершаются,
  # web ждёт их успеха. Учётные данные владельца схемы есть только здесь и у standtools
  # (профиль dev): иначе взлом портала обходил бы запрет crm_app менять журнал.
  migrate:
    image: crm-portal:local
    restart: "no"
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
    command: ["true"]
    depends_on:
      postgres:
        condition: service_healthy

  # Рабочие процессы разнесены по очередям, чтобы тяжёлое не ждало лёгкого. `worker` — очередь files
  # (проверка фото на вирусы), две копии (deploy.replicas); --with-scheduler нужен для пауз между
  # повторами проверок. Том protected — тот же, что у web: рабочие пишут перекодированные фото.
  # От здоровья clamav рабочие не зависят: недоступная проверка повторяется заданием.
  worker:
    image: crm-portal:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_MIGRATE_URL: ""
      CLAMAV_HOST: "${CLAMAV_HOST:-clamav}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
      CLAMAV_TIMEOUT: "${CLAMAV_TIMEOUT:-120}"
    command: rq worker -c config.rq_settings --with-scheduler files
    deploy:
      replicas: 2
    volumes:
      - protected:/app/protected
    depends_on:
      web:
        condition: service_healthy   # схема базы уже мигрирована
      valkey:
        condition: service_healthy

  # Письма и ночное обслуживание: очереди mail и maintenance, в таком порядке.
  worker-mail:
    image: crm-portal:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_MIGRATE_URL: ""
      CLAMAV_HOST: "${CLAMAV_HOST:-clamav}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
      CLAMAV_TIMEOUT: "${CLAMAV_TIMEOUT:-120}"
    command: rq worker -c config.rq_settings --with-scheduler mail maintenance
    volumes:
      - protected:/app/protected
    depends_on:
      web:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Приём писем в ящик заявок: очередь inbox, чтобы медленный ящик не задерживал остальное.
  worker-inbox:
    image: crm-portal:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_MIGRATE_URL: ""
      CLAMAV_HOST: "${CLAMAV_HOST:-clamav}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
      CLAMAV_TIMEOUT: "${CLAMAV_TIMEOUT:-120}"
    command: rq worker -c config.rq_settings --with-scheduler inbox
    volumes:
      - protected:/app/protected
    depends_on:
      web:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Резервные копии: crond в образе postgres:17-alpine запускает по crontab (01:30 по Москве)
  # скрипт backup.sh: дамп базы под владельцем схемы, архивы томов protected и media (только
  # чтение), удаление копий старше 14 дней. Каталог ./backup смонтирован только для чтения,
  # поэтому расписание ставится командой crontab, а не копированием в /etc/crontabs.
  # Из файла окружения берётся только адрес DATABASE_MIGRATE_URL (env_file не подключается).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      DATABASE_MIGRATE_URL: "${DATABASE_MIGRATE_URL}"
      TZ: Europe/Moscow
    entrypoint: ["sh", "-c"]
    command: ["crontab /backup/crontab && exec crond -f -d 8"]
    volumes:
      - ./backup:/backup:ro
      - backups:/backups
      - protected:/data/protected:ro
      - media:/data/media:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Антивирус ClamAV (clamd, порт 3310 только внутри сети compose, наружу не публикуется).
  # Образ с базами сигнатур; том clamav-db хранит базы (Docker заполняет его из образа,
  # только пока он пуст). freshclam.conf смонтирован только для чтения. Единственная
  # настройка clamd — CLAMD_CONF_AlertEncryptedArchive: шифрованные архивы помечаются
  # как заражённые (Heuristics.Encrypted.*). Переменные FRESHCLAM_CONF_* и FRESHCLAM_CHECKS не
  # задаются: /init образа работает под `set -eu` и правит по ним файлы командой `sed -i`,
  # а freshclam.conf смонтирован только для чтения, запуск упадёт; частота обновления баз —
  # как в образе (при старте и раз в сутки).
  clamav:
    image: clamav/clamav:1.4.6
    restart: unless-stopped
    environment:
      CLAMD_CONF_AlertEncryptedArchive: "yes"
    volumes:
      - clamav-db:/var/lib/clamav
      - ./clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  # Ночные задания: rq cron кладёт их в очередь, исполняет worker.
  scheduler:
    image: crm-portal:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_MIGRATE_URL: ""
    command: rq cron config.cron -c config.rq_settings
    depends_on:
      web:
        condition: service_healthy
      valkey:
        condition: service_healthy

  nginx:
    build:
      <<: *portal-build
      target: nginx
    image: crm-portal-nginx:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8031:${NGINX_PORT:-8443}"   # единственный наружный порт портала
    environment:
      # список для set_real_ip_from; внутренняя сеть compose — всегда в нём
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-},${CRM_SUBNET:-172.31.77.0/24}"
      PORTAL_URL: ${PORTAL_URL:?задайте PORTAL_URL в deploy/.env}
      HEALTH_URL: ${NGINX_HEALTH_URL:-https://127.0.0.1:8443/health/}
    volumes:
      - ${NGINX_CONF:-./nginx.conf}:/etc/nginx/nginx.conf.template:ro
      - ./nginx-render.sh:/docker-entrypoint.d/10-render-conf.sh:ro
      - ./certs:/etc/nginx/certs:ro
      - media:/srv/media:ro
      - protected:/srv/protected:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # запрос к /health/ с тем же именем хоста, что в PORTAL_URL; самоподписанный сертификат не проверяется
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null --header \"Host: $${PORTAL_URL#*://}\" $$HEALTH_URL"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Только стенд разработки: команды управления с E2E_STAND=1 (e2e_reset_stand).
  standtools:
    image: crm-portal:local
    profiles: ["dev"]
    restart: unless-stopped
    env_file: .env
    environment:
      E2E_STAND: "1"
    command: sleep infinity
    volumes:
      - protected:/app/protected  # e2e_reset_stand стирает файлы фото (R-2242-2)
    depends_on:
      web:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.3
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # ящик и API
      - "127.0.0.1:1025:1025"   # SMTP
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Тестовый IMAP-ящик заявок (PLAN-003, «Тестовый ящик»): только стенд и тесты, в установку не входит.
  # Образ закреплён по дайджесту (запасной тег 2.4.4). IMAP слушает порт 31143 внутри сети
  # compose; на хосте он виден только на 127.0.0.1. Любое имя пользователя входит с паролем
  # USER_PASSWORD (формат {PLAIN}пароль). Проверки здоровья нет: в образе нет оболочки,
  # готовность ящика ждут сами тесты повтором входа. Без `:?`: compose подставляет переменные
  # во весь файл независимо от профилей, и на установке без IMAP_PASSWORD он бы сломался.
  dovecot:
    image: dovecot/dovecot:2.4.5@sha256:43c14def08a57f25107593cbcf64a0a6fbae84a7b9de7aa038513c9b21e91914
    profiles: ["dev", "test"]
    restart: unless-stopped
    environment:
      USER_PASSWORD: "{PLAIN}${IMAP_PASSWORD:-}"
    volumes:
      - ./dovecot/99-test.conf:/etc/dovecot/conf.d/99-test.conf:ro
    ports:
      - "127.0.0.1:31143:31143"

  # Учебная служба ботов (PLAN-004, «Запуск»): только стенд и тесты, в установку не входит.
  # Часть Bot API Telegram и MAX на стандартной библиотеке Python; служебные адреса /_test/…
  # для тестов и приёмки. Порт 8099 внутри сети compose, на хосте — только 127.0.0.1.
  # Токенов здесь нет: тесты задают их сами.
  fakebots:
    image: python:3.12-slim-bookworm
    profiles: ["dev", "test"]
    restart: unless-stopped
    command: ["python", "-u", "/srv/server.py"]
    volumes:
      - ./fakebots:/srv:ro
    ports:
      - "127.0.0.1:8099:8099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/_test/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Тесты: pytest + pytest-django на PostgreSQL этого же стенда.
  # Тестовая база test_crm создаётся и мигрируется под crm_owner, запросы теста
  # идут под crm_app. Valkey — база 15, не рабочая 0.
  test:
    image: python:3.12-slim-bookworm
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy
        required: false   # профиль dev; нужен только тестам почты
      clamav:
        condition: service_healthy   # настоящий clamd для test_clamav_live и проверки фото
      dovecot:
        condition: service_started   # проверки здоровья у образа нет (нет оболочки)
      fakebots:
        condition: service_healthy   # учебная служба ботов (PLAN-004)
    env_file: .env
    environment:
      VALKEY_URL: redis://valkey:6379/15
      TELEGRAM_API_BASE: http://fakebots:8099
      MAX_API_BASE: http://fakebots:8099/max
      CLAMAV_HOST: "${CLAMAV_HOST:-clamav}"
      CLAMAV_PORT: "${CLAMAV_PORT:-3310}"
      CLAMAV_TIMEOUT: "${CLAMAV_TIMEOUT:-120}"
      PIP_ROOT_USER_ACTION: ignore
      PIP_DEFAULT_TIMEOUT: "60"
      PIP_RETRIES: "10"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    working_dir: /app/backend
    volumes:
      - ../backend:/app/backend
      - ../deploy:/app/deploy:ro   # тесты каркаса и развёртывания (T-100, T-118) читают deploy/
      - ./run-tests.sh:/run-tests.sh:ro
      - test-venv:/opt/venv
    entrypoint: ["sh", "/run-tests.sh"]

networks:
  default:
    driver_opts:
      # MTU сети — параметр: на ВМ общества 1500; на машине разработки выход
      # наружу идёт через VPN с MTU 1376 и при 1500 TLS из контейнеров к PyPI
      # зависает, поэтому в deploy/.env разработчика DOCKER_MTU=1360
      com.docker.network.driver.mtu: "${DOCKER_MTU:-1500}"
    ipam:
      config:
        - subnet: ${CRM_SUBNET:-172.31.77.0/24}   # известная сеть: её адреса — в TRUSTED_PROXIES

volumes:
  postgres-data:
  valkey-data:
  clamav-db:
  test-venv:
  media:
  protected:
  backups:
