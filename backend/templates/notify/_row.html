<li data-notification="{{ note.pk }}" data-unread="{% if note.read_at %}0{% else %}1{% endif %}" class="list-group-item d-flex flex-wrap gap-2 align-items-baseline">
  <span data-field="text" class="flex-grow-1"><a data-open href="/notifications/{{ note.pk }}/open/">{{ note.text }}</a></span>
  <span data-field="kind" class="text-muted small">{{ note.kind_title }}</span>
  <time data-at="{{ note.created_at|date:'c' }}" class="text-muted small">{{ note.created_at|date:'d.m.Y H:i' }}</time>
  {% if not note.read_at %}<span data-unread-mark class="badge text-bg-primary">новое</span>
  <form data-form="read" method="post" action="/notifications/{{ note.pk }}/read/" hx-post="/notifications/{{ note.pk }}/read/" hx-target="closest li" hx-swap="outerHTML">{% csrf_token %}
    <input type="hidden" name="f" value="{{ filter_value }}">
    <input type="hidden" name="page" value="{{ page_number }}">
    <button type="submit" class="btn btn-outline-secondary btn-sm" data-action="read">Прочитать</button>
  </form>{% endif %}
</li>
