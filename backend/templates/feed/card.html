{% extends layout %}
{% load static %}
{% block title %}Запись в ленте{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'feed/feed.css' %}">
<script defer src="{% static 'feed/feed.js' %}"></script>
<div class="feed-page" data-feed-page="card">
  <h1 class="page-title">Запись в ленте</h1>
  {% for item in posts %}{% include "feed/_post.html" %}{% endfor %}
  {# Все комментарии и действия — T-7218, место в общей части -comments. #}
  <div id="feed-live" hx-ext="ws" ws-connect="{{ ws_url }}" data-ws="connecting" data-opened="{{ opened.isoformat }}"></div>
  <div id="feed-synced"></div>
</div>
{% endblock %}
