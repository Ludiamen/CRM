{# Инструмент «Ссылка на статью» под полем внутреннего комментария (FR-430); стоит внутри формы комментария, поэтому без своей формы и кнопки только type="button" #}
<div class="kb-link-tool" data-kb-link-tool>
  <button class="btn btn-outline-secondary btn-sm" type="button" data-action="kb-link-tool">Ссылка на статью</button>
  <div class="kb-link-panel" data-kb-link-panel hidden>
    <input class="form-control form-control-sm" type="search" name="pick" maxlength="200" autocomplete="off" placeholder="Заголовок статьи">
    <ul class="card-list kb-pick" data-kb-pick-results></ul>
  </div>
</div>
