{# Кнопка закрытой заявки «Статья из решения» (FR-427) #}
<form class="card-form" data-form="kb-from-ticket" method="post" action="/kb/from-ticket/{{ ticket_number }}/" hx-post="/kb/from-ticket/{{ ticket_number }}/" hx-target="closest [data-card-part]" hx-swap="outerHTML">

</form>
