<li data-article-id="{{ article.pk }}" class="kb-row"><a data-field="title" href="/kb/{{ article.pk }}/">{{ article.title }}</a> <span class="small text-muted"><span data-field="rubric">{{ article.rubric.name }}</span>, <time data-at="{{ article.updated_at|date:'c' }}" datetime="{{ article.updated_at|date:'c' }}">{{ article.updated_at|date:'d.m.Y H:i' }}</time></span>{% if show_tags %}{% for tag in article.tags.all %} <a class="badge text-bg-light" data-tag="{{ tag.name }}" href="/kb/tags/?name={{ tag.name|urlencode:'' }}">{{ tag.name }}</a>{% endfor %}{% endif %}</li>
