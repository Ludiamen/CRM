{% extends layout %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1 class="h4 mb-3">Вход в портал</h1>
{% if idle %}<div class="alert alert-warning" role="status">Вы вышли из портала из-за бездействия. Войдите снова.</div>{% endif %}
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ action }}">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="id_email">Рабочая почта</label>
    <input class="form-control" id="id_email" name="email" type="email" autocomplete="username" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label" for="id_password">Пароль</label>
    <input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required>
  </div>
  <button class="btn btn-primary w-100" type="submit">Продолжить</button>
</form>
<p class="mt-3 mb-0 text-center"><a href="/password/forgot/">Забыли пароль?</a></p>
{% endblock %}
