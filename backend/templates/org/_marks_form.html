<details class="members-add" data-action="{{ name }}">
  <summary class="btn btn-outline-primary btn-sm">{{ title }}</summary>
  <form method="post" action="/structure/{{ unit.pk }}/marks/" data-form="{{ name }}">{% csrf_token %}
    <input type="hidden" name="part" value="{{ part }}">
    {% if not everyone %}<p class="small text-muted mb-1">В узле пока нет участников: сначала добавьте сотрудников.</p>{% endif %}
    <ul class="member-list">
      {% for row in everyone %}
      <li class="form-check">
        <input class="form-check-input" type="checkbox" name="users" value="{{ row.user.pk }}" id="{{ name }}-{{ row.user.pk }}"{% if row.mark == mark %} checked{% endif %}>
        <label class="form-check-label" for="{{ name }}-{{ row.user.pk }}">{{ row.user.full_name }}</label>
      </li>
      {% endfor %}
    </ul>
    <button class="btn btn-primary btn-sm" type="submit">Сохранить</button>
  </form>
</details>
