<details class="members-add" data-action="unit-roles">
  <summary class="btn btn-outline-primary btn-sm">Роли узла</summary>
  <form method="post" action="/structure/{{ unit.pk }}/roles/" data-form="unit-roles">{% csrf_token %}
    <p class="small text-muted mb-1">Роль действует на всех участников узла и вложенных узлов.</p>
    <ul class="member-list">
      {% for item in role_choices %}
      <li class="form-check">
        <input class="form-check-input" type="checkbox" name="roles" value="{{ item.role.pk }}" id="unit-roles-{{ item.role.pk }}"{% if item.checked %} checked{% endif %}>
        <label class="form-check-label" for="unit-roles-{{ item.role.pk }}">{{ item.role.name }}</label>
      </li>
      {% endfor %}
    </ul>
    <button class="btn btn-primary btn-sm" type="submit">Сохранить</button>
  </form>
</details>
