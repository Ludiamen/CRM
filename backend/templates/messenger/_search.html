<form class="messenger-search" method="get" action="/messenger/" role="search">
  <label class="visually-hidden" for="id_messenger_list_q">Поиск по чатам</label>
  <input id="id_messenger_list_q" type="search" name="q" value="{{ q }}" class="form-control"
         placeholder="Поиск по чатам и людям" autocomplete="off">
  <button type="submit" class="btn btn-outline-secondary">Найти</button>
</form>
