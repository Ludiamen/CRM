<div data-requester-fields class="row g-2 mb-3">
  <div class="col-12 col-md-6">
    <label class="form-label" for="id_name">ФИО заявителя</label>
    <input class="form-control" id="id_name" name="name" type="text" maxlength="255" autocomplete="off" value="{{ requester_name }}">
    {% if field_error and field_error.field == "name" %}<div class="invalid-feedback d-block" data-error="name" data-code="{{ field_error.code }}">{{ field_error.text }}</div>{% endif %}
  </div>
  <div class="col-12 col-md-6">
    <label class="form-label" for="id_client_unit">Подразделение заявителя</label>
    <select class="form-select" id="id_client_unit" name="client_unit">
      <option value="">Не указано</option>
      {% for item in unit_choices %}<option value="{{ item.id }}"{% if item.selected %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
    </select>
  </div>
</div>
