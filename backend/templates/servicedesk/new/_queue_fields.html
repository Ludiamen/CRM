<div data-queue-fields class="row g-2 mb-3">
  <div class="col-12 col-md-6">
    <label class="form-label" for="id_queue">Очередь</label>
    <select class="form-select" id="id_queue" name="queue" required hx-get="/tickets/new/queue/" hx-include="[name=category]" hx-target="[data-queue-fields]" hx-swap="outerHTML" hx-trigger="change">
      {% for item in state.queue_choices %}<option value="{{ item.id }}"{% if item.selected %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
    </select>
    {% if field_error and field_error.field == "queue" %}<div class="invalid-feedback d-block" data-error="queue" data-code="{{ field_error.code }}">{{ field_error.text }}</div>{% endif %}
  </div>
  <div class="col-12 col-md-6 d-flex align-items-end">
    <div class="form-check mb-2">
      <input class="form-check-input" id="id_take" name="take" type="checkbox" value="1"{% if state.take_checked %} checked{% endif %}{% if not state.take_enabled %} disabled{% endif %}>
      <label class="form-check-label" for="id_take">Взять себе</label>
    </div>
  </div>
</div>
