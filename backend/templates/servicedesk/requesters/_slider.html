<a class="slider-backdrop" href="/servicedesk/requesters/" aria-label="Закрыть панель" tabindex="-1"></a>
<section class="slider-panel" role="dialog" aria-labelledby="slider-title" tabindex="-1">
  <header class="slider-header">
    <h2 id="slider-title">Правка заявителя</h2>
    <a class="slider-close" data-slider-close href="/servicedesk/requesters/" aria-label="Закрыть">&times;</a>
  </header>
  <div class="slider-body">
    <form method="post" action="/servicedesk/requesters/{{ form.record.pk }}/edit/" data-form="requester">
      {% csrf_token %}
      {% if form.error %}<div class="alert alert-danger" role="alert" data-code="{{ form.code }}">{{ form.error }}</div>{% endif %}
      <p class="text-muted" data-field="email">{{ form.record.email }}</p>
      <div class="mb-3">
        <label class="form-label" for="id_name">ФИО</label>
        <input class="form-control" id="id_name" name="name" value="{{ form.name }}" autocomplete="off">
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_client_unit">Подразделение</label>
        <select class="form-select" id="id_client_unit" name="client_unit"><option value="">Не указано</option>{% for item in form.choices %}<option value="{{ item.id }}"{% if item.selected %} selected{% endif %}>{{ item.name }}{% if item.archived %} (в архиве){% endif %}</option>{% endfor %}</select>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-primary" type="submit">Сохранить</button>
        <a class="btn btn-outline-secondary" href="/servicedesk/requesters/">Отмена</a>
      </div>
    </form>
  </div>
</section>
