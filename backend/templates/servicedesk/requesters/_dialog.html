<div class="dialog-backdrop">
  <section class="dialog-panel" data-dialog="requester-delete" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">
    <h2 id="dialog-title" class="dialog-title">Удалить запись заявителя</h2>
    {% if dialog.error %}<div class="alert alert-danger" role="alert" data-code="{{ dialog.code }}">{{ dialog.error }}</div>{% endif %}
    <ul class="dialog-consequences">
      <li data-consequence>Запись заявителя будет удалена. Удалить можно только запись без заявок.</li>
    </ul>
    <form method="post" action="/servicedesk/requesters/{{ dialog.record.pk }}/delete/" data-form="requester-delete">
      {% csrf_token %}
      <input type="hidden" name="confirm" value="1">
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-danger" type="submit">Удалить</button>
        <button class="btn btn-outline-secondary" type="button" data-dialog-cancel>Отмена</button>
      </div>
    </form>
  </section>
</div>
