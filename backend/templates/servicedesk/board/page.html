{% extends layout %}
{% load static %}
{% block title %}Заявки — канбан{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'servicedesk/board.css' %}">
<div class="tickets-list" data-ticket-board-page>
  <header class="page-head">
    <h1 class="page-title">Заявки</h1>
    <a class="btn btn-outline-secondary" data-board-toggle="list"
       href="/tickets/?{{ board_params|cut:'view=board&'|cut:'&view=board' }}">Список</a>
    {% if can_create %}<a class="btn btn-primary" data-action="ticket-new" href="/tickets/new/">Новая заявка</a>{% endif %}
  </header>
  <form class="filter-bar card card-body mb-3" method="get" action="/tickets/board/">
    <input type="hidden" name="view" value="board">
    <div class="row g-2 align-items-end">
      <div class="col-6 col-md-3">
        <label class="form-label small mb-1" for="board-queue">Очередь</label>
        <select class="form-select" id="board-queue" name="queue">
          <option value="">Любая</option>
          {% for item in queue_choices %}<option value="{{ item.id }}"{% if item.selected %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small mb-1" for="board-priority">Критичность</label>
        <select class="form-select" id="board-priority" name="priority">
          <option value="">Любая</option>
          {% for item in priority_choices %}<option value="{{ item.id }}"{% if item.selected %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small mb-1" for="board-status">Статус</label>
        <select class="form-select" id="board-status" name="status">
          <option value="">Все</option>
          {% for item in status_choices %}<option value="{{ item.id }}"{% if item.selected %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-6 col-md-3">
        <button class="btn btn-primary" type="submit">Показать</button>
      </div>
    </div>
  </form>
  {% csrf_token %}
  {% include "servicedesk/board/_board.html" %}
</div>
<script src="{% static 'js/tickets-board.js' %}" defer></script>
{% endblock %}
