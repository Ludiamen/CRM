{% if errors %}<div class="alert alert-danger" role="alert"><ul class="mb-0">{% for message in errors %}<li>{{ message }}</li>{% endfor %}</ul></div>{% endif %}
<form method="post" action="/me/security/password/">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label" for="id_current_password">Текущий пароль</label>
    <input class="form-control" id="id_current_password" name="current_password" type="password" autocomplete="current-password" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="id_password1">Новый пароль</label>
    <input class="form-control" id="id_password1" name="password1" type="password" autocomplete="new-password" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="id_password2">Повторите новый пароль</label>
    <input class="form-control" id="id_password2" name="password2" type="password" autocomplete="new-password" required>
  </div>
  <button class="btn btn-primary" type="submit">Сменить пароль</button>
</form>
