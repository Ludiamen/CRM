{% extends layout %}
{% block title %}Сотрудники{% endblock %}
{% block content %}
<div class="page-head">
  <h1 class="page-title">Сотрудники</h1>
  <a class="btn btn-primary" href="/staff/new/">Добавить сотрудника</a>
</div>
<form id="staff-filter" class="filter-bar card card-body mb-3" method="get" action="/staff/"
      hx-get="/staff/" hx-target="#staff-results" hx-swap="innerHTML" hx-push-url="true" hx-trigger="submit, change">
  <div class="row g-2 align-items-end">
    <div class="col-12 col-md-4">
      <label class="form-label small mb-1" for="id_q">Поиск по ФИО и почте</label>
      <input class="form-control" id="id_q" name="q" type="search" value="{{ q }}" autocomplete="off">
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label small mb-1" for="id_state">Состояние</label>
      <select class="form-select" id="id_state" name="state">
        <option value="">Любое</option>
        <option value="active"{% if state == "active" %} selected{% endif %}>Активные</option>
        <option value="invited"{% if state == "invited" %} selected{% endif %}>Приглашённые</option>
        <option value="blocked"{% if state == "blocked" %} selected{% endif %}>Заблокированные</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="form-label small mb-1" for="id_role">Роль</label>
      <select class="form-select" id="id_role" name="role">
        <option value="">Любая</option>
        {% for item in roles %}<option value="{{ item.pk }}"{% if role == item.pk|stringformat:"s" %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-12 col-md-2 d-flex gap-2">
      <button class="btn btn-primary flex-fill" type="submit">Найти</button>
      <a class="btn btn-outline-secondary" href="/staff/">Сбросить</a>
    </div>
  </div>
  <input type="hidden" name="sort" value="{{ sort }}">
</form>
<div id="staff-results" class="staff-results">
  {% include "staff/_results.html" %}
</div>
<div id="slider-root" class="slider-root">{% if slider_body %}{% include "staff/_slider.html" %}{% endif %}</div>
{% endblock %}
