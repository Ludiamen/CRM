[pytest]
# Этап 1: Django поднимается на каркасных настройках tests/settings_stage1.py —
# модель core.User появится в Этапе 3 (T-200), до неё config.settings не
# стартует. В T-200 заменить на `config.settings` и удалить settings_stage1.py.
DJANGO_SETTINGS_MODULE = tests.settings_stage1
pythonpath = .
testpaths = tests
python_files = test_*.py
# e2e (Playwright) идёт отдельной командой против стенда: pytest tests/e2e
addopts =
    -p no:cacheprovider
    --ignore=tests/e2e
    --strict-markers
    --output=../playwright-report
    --tracing=retain-on-failure
    --screenshot=only-on-failure
markers =
    e2e: проход в браузере против стенда (Playwright)
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
